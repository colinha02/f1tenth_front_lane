front_lane_detector:
  ros__parameters:
    image_topic: "/camera/image_rect"
    mask_topic: "/front_lane/mask"
    overlay_topic: "/front_lane/overlay"
    model_topic: "/front_lane/model"
    preview_enabled: true
    preview_window_name: "Front lane detection"
    preview_fps: 30.0

    # Lower half of the front image.  This removes the wall/background while
    # retaining the nearby track section used for lane tracking.
    roi_top_ratio: 0.5
    roi_bottom_ratio: 1.0
    window_count: 12
    window_margin_px: 85
    # Max horizontal prediction change between vertically adjacent windows.
    # The closest connected white component is used instead of averaging all.
    window_prediction_max_step_px: 55
    # Number of full lane-path candidates retained while scoring all connected
    # white components from the bottom window to the top window.
    candidate_path_count: 16
    # A tape edge can be only a few pixels wide in one window.  Small pieces
    # remain candidates and are judged by full-path continuity instead.
    minimum_component_pixels: 8
    minimum_window_pixels: 35
    minimum_fit_pixels: 180

    # White tape on black track: retain bright, low-saturation pixels only
    # when they touch a strong black/white intensity edge.
    white_lightness_min: 165
    white_saturation_max: 120
    edge_low_threshold: 35
    edge_high_threshold: 110
    edge_dilation_px: 3
    morphology_kernel_px: 5
    minimum_fit_vertical_coverage_ratio: 0.45

    # Per-frame polynomial changes beyond this are treated as background
    # reacquisition.  The previous valid curve is held only briefly.
    temporal_alpha: 0.70
    temporal_maximum_jump_px: 70.0
    temporal_hold_frames: 8
    expected_lane_width_px: 720.0
    minimum_lane_width_px: 100.0
    maximum_lane_width_px: 1400.0
    lookahead_ratio: 0.48

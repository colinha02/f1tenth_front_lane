front_lane_rotated_detector:
  ros__parameters:
    # Experimental node: original front_lane_detector.yaml is unchanged.
    preview_enabled: true
    preview_window_name: "Front lane detection - rotated experiment"
    preview_fps: 30.0
    processing_fps: 30.0
    roi_top_ratio: 0.56
    roi_bottom_ratio: 1.00
    seed_row_ratio: 0.75
    close_target_y_ratio: 0.70
    far_target_y_ratio: 0.60
    vehicle_reference_y_ratio: 0.955
    # All windows use the local lane tangent.  The 90 px normal width is half
    # of the former 181 px axis-aligned horizontal search range.
    rotated_window_length_px: 28
    rotated_window_width_px: 90
    rotated_step_px: 14
    rotated_turn_side_extra_px: 0
    rotated_max_turn_deg_per_window: 18.0
    rotated_max_turn_change_deg_per_window: 10.0
    rotated_heading_update_gain: 0.45

    # The base preview can draw only axis-aligned bounding boxes.  Keep it
    # off here and use the separate diagnostic window, which draws the true
    # rotated polygons without the misleading overlapping squares.
    show_diagnostic_windows: false
